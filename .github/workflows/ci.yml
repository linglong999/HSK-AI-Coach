# ============================================================
# HSK-AI-Coach · CI 回归保护（P0.9）
# 零运行时依赖、纯标准库：仅跑 unittest 全集，无需 pip install。
# 作用：本地改动推上远程 / 开 PR 后自动回归，保护 P0.2-P0.4 等核心 schema 改动。
# 注意：本文件必须保持 LF 行尾（禁止 CRLF）——GitHub runner 的 bash 会把
#       多行 run: 脚本里的 CR 当成命令一部分，导致 then 等关键字语法报错。
# ============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero runtime dependencies
        shell: bash
        run: |
          # requirements.txt 应为空（仅注释），确认无第三方运行时依赖。
          # 注意：GH Actions 以 bash -e -o pipefail 执行 run；勿用 grep|grep|wc 数行——
          #   全被过滤后首个 grep -v 选中 0 行会以退出码 1 结束，pipefail 传导 + set -e
          #   会让本步骤误红（此前 CI 全 job 失败的根因）。用 awk（恒定退出 0）数
          #   "非注释(#打头)且非空"的行。
          if [ -f requirements.txt ]; then
            deps=$(awk 'NF && $1!="#" {c++} END {print c+0}' requirements.txt)
            if [ "$deps" -ne 0 ]; then
              echo "requirements.txt 含未预期依赖，请检查"; cat requirements.txt; exit 1
            fi
          fi
          echo "OK: 无第三方运行时依赖"

      - name: Run unittest suite
        shell: bash
        run: |
          # 测试失败时保留退出码上抛（CI 标红），同时把完整输出落盘供 artifact 排查。
          # 注意 pipefail：若 python 失败，管道退出码由 || 透传，set -e 使步骤变红，
          # 但仍能拿到 unittest_verbose.log。
          python -m unittest discover -s tests -p "test_*.py" -v \
            > unittest_verbose.log 2>&1 || { ec=$?; echo "== unittest exit code: $ec =="; exit $ec; }

      - name: Upload unittest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-verbose-log
          path: unittest_verbose.log
          if-no-files-found: error