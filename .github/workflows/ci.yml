# ============================================================
# HSK-AI-Coach · CI 回归保护（P0.9）
# 0.31 起运行时依赖 requests + python-dotenv（主流化决策，解除零依赖约束）。
# 作用：本地改动推上远程 / 开 PR 后自动回归，保护 P0.2-P0.4 等核心 schema 改动。
# 注意：本文件必须保持 LF 行尾（禁止 CRLF）——GitHub runner 的 bash 会把
#       多行 run: 脚本里的 CR 当成命令一部分，导致 then 等关键字语法报错。
# ============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          # 运行时依赖（requirements.txt）+ dev/test 依赖 pytest。
          pip install -r requirements.txt -q
          pip install pytest -q

      - name: Run pipeline (pytest)
        shell: bash
        run: |
          # 用 pytest 收集运行；缺例外依赖（rapidocr/pymupdf）的端到端用例
          # 由 pytestmark.skipif 正常 skip，不再因 import pytest 在收集阶段崩溃。
          # 失败时保留退出码上抛（CI 标红），同时把完整输出落盘供排查。
          python -m pytest tests -q \
            > pytest_verbose.log 2>&1 || { ec=$?; echo "== pytest exit code: $ec =="; exit $ec; }

      - name: Emit failure annotations
        if: failure()
        shell: bash
        run: |
          # 把失败/错误/断言摘要暴露到 GitHub annotations（无需下载 artifact 即可读）。
          # 逐行取出失败相关的行，每一条作为 ::error:: 输出到日志与 check-run。
          grep -nE "FAILED|AssertionError|ModuleNotFoundError|ImportError|Traceback|passed|failed|error" \
            pytest_verbose.log || true
          awk '/^FAILED/{print "::error::"$0}' pytest_verbose.log || true
          echo "== end failure annotations =="

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-verbose-log
          path: pytest_verbose.log
          if-no-files-found: error