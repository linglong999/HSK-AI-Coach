# ============================================================
# HSK-AI-Coach · CI 回归保护（P0.9）
# 0.31 起运行时依赖 requests + python-dotenv（主流化决策，解除零依赖约束）。
# 作用：本地改动推上远程 / 开 PR 后自动回归，保护 P0.2-P0.4 等核心 schema 改动。
# 注意：本文件必须保持 LF 行尾（禁止 CRLF）——GitHub runner 的 bash 会把
#       多行 run: 脚本里的 CR 当成命令一部分，导致 then 等关键字语法报错。
# ============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "30 20 * * *"    # 每晚 20:30 UTC 全量回归（nightly，含 LLM judge 语义质量门控）

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv with python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (uv sync)
        shell: bash
        run: |
          # uv sync 一键装齐运行时 + dev（fastapi/httpx/pytest）+ editable install 包，
          # 一次同时验证"依赖装齐 + config/engine 包可导入"，与真实用户安装视角一致。
          # --frozen 要求 uv.lock 与 pyproject 严格一致（锁文件已提交）。
          uv sync --frozen -q

      - name: Run pipeline (pytest)
        shell: bash
        run: |
          # 用 pytest 收集运行；缺例外依赖（rapidocr/pymupdf）的端到端用例
          # 由 pytestmark.skipif 正常 skip，不再因 import pytest 在收集阶段崩溃。
          # 失败时保留退出码上抛（CI 标红），同时把完整输出落盘供排查。
          uv run pytest tests -q \
            > pytest_verbose.log 2>&1 || { ec=$?; echo "== pytest exit code: $ec =="; exit $ec; }

      - name: Run B6 deterministic regression (PR gate, zero-LLM)
        shell: bash
        run: |
          # B6-A④：PR gate 只跑影响路径的轻量 subset——deterministic 层（L1/L3 红线全护 +
          # 语料加载 + D-6 断言，mock 模式零 LLM 成本）。失败即标红阻塞 PR。
          uv run python -m datasets.eval.run_all --layer deterministic

      - name: Emit failure annotations
        if: failure()
        shell: bash
        run: |
          # 把失败/错误/断言摘要暴露到 GitHub annotations（无需下载 artifact 即可读）。
          # 逐行取出失败相关的行，每一条作为 ::error:: 输出到日志与 check-run。
          grep -nE "FAILED|AssertionError|ModuleNotFoundError|ImportError|Traceback|passed|failed|error" \
            pytest_verbose.log || true
          awk '/^FAILED/{print "::error::"$0}' pytest_verbose.log || true
          echo "== end failure annotations =="

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-verbose-log
          path: pytest_verbose.log
          if-no-files-found: error

  # B6-A④：全量回归放 nightly（不每条 PR 跑全套，防 CI 过慢 flaky）。
  # 跑 run_all --layer nightly = deterministic 全量 + llm_judge 语义质量 + 统计门控。
  # 注：L2 语义门控需注入 judge LLM client（set_judge_client）方生效；未注入时 llm_judge
  #    suite 记 NOT_RUN 不误阻塞，deterministic 红线/d6 门控仍全效。
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv with python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (uv sync)
        shell: bash
        run: uv sync --frozen -q

      - name: Run full regression (nightly)
        shell: bash
        run: |
          # 全量回归：deterministic(L1/L3+d6) + llm_judge(L2 语义质量 + baseline 统计门控)。
          # exit 0=过 / 1=阻塞；失败落盘供排查。
          uv run python -m datasets.eval.run_all --layer nightly \
            > run_all_nightly.log 2>&1 || { ec=$?; echo "== run_all exit code: $ec =="; exit $ec; }

      - name: Upload run_all log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-nightly-log
          path: run_all_nightly.log
          if-no-files-found: error