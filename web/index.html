<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK-AI-Coach · 认知地图</title>
<style>
  :root{
    --bg:#0d1017; --panel:#151a23; --panel2:#1b2230; --line:#28304a;
    --tx:#dde4f0; --tx2:#8b94a8; --tx3:#5c6579;
    --ac:#4f9cff; --ok:#3fd68f; --warn:#e8b45a; --err:#ef6a5f;
    --kp-vocab:#4f9cff; --kp-grammar:#a88bfa; --kp-pragma:#e8925a; --kp-char:#ef6a5f;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
  #app{display:grid;grid-template-rows:54px 1fr;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .logo{font-weight:700;font-size:16px;letter-spacing:.4px}
  header .logo b{color:var(--ac)}
  header .sub{font-size:12px;color:var(--tx2)}
  header .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
  header .status .dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
  header .status.on .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  header .status.off .dot{background:var(--err)}
  main{display:grid;grid-template-columns:400px 1fr;min-height:0}
  @media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:45vh 1fr}}

  /* ---- 左：对话流 ---- */
  .left{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .chat::-webkit-scrollbar{width:8px}
  .chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .inputrow{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel2)}
  .inputrow input{flex:1;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px;outline:none}
  .inputrow input:focus{border-color:var(--ac)}
  .inputrow button{padding:0 18px;border:0;border-radius:var(--r-sm);background:var(--ac);color:#fff;font-size:14px;cursor:pointer;font-weight:600}
  .inputrow button:disabled{opacity:.45;cursor:default}
  .empty{color:var(--tx2);font-size:13px;text-align:center;padding:28px 12px;line-height:1.9}
  .empty b{color:var(--tx)}

  .msg-user{align-self:flex-end;max-width:86%;background:#1d3a5f;border:1px solid #2c4f7d;border-radius:var(--r-md) var(--r-md) 4px var(--r-md);padding:9px 12px;font-size:14px;line-height:1.55;white-space:pre-wrap;animation:pop .18s ease}
  .msg-ai{align-self:stretch;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* 偏误卡 */
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
  .card .head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
  .tag.vocab{background:#12355c;color:var(--kp-vocab)} .tag.grammar{background:#2a1d5c;color:var(--kp-grammar)}
  .tag.pragma{background:#3d2a14;color:var(--kp-pragma)} .tag.char{background:#3d1414;color:var(--kp-char)}
  .frag{font-size:15px;font-weight:600;color:var(--err);text-decoration:line-through;text-decoration-color:rgba(239,106,95,.55)}
  .corr{font-size:15px;font-weight:600;color:var(--ok)}
  .expl{font-size:13px;line-height:1.7;color:var(--tx);white-space:pre-wrap;margin-top:6px}
  .kp-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .kp{padding:2px 9px;border-radius:6px;font-size:12px;color:var(--ac);background:rgba(79,156,255,.09);border:1px solid rgba(79,156,255,.22)}
  .meta-row{font-size:11px;color:var(--tx3);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
  .meta-row .ok-w{color:var(--ok)}
  .next{margin-top:10px;display:flex;gap:8px;align-items:center}
  .btn-sm{padding:6px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:12.5px;cursor:pointer;font-weight:600}
  .btn-sm:hover{border-color:var(--ac);color:var(--ac)}
  .btn-sm:disabled{opacity:.45;cursor:default}

  /* 正确句卡 */
  .card.clean{border-color:rgba(63,214,143,.35);background:linear-gradient(180deg,rgba(63,214,143,.07),var(--panel2))}
  .card.clean .head{margin-bottom:2px}
  .clean-title{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ok);font-size:14px}
  .clean-sub{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.6}

  /* 复述区 */
  .retell{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .retell .rt-title{font-size:12.5px;color:var(--tx2);margin-bottom:7px}
  .retell textarea{width:100%;min-height:64px;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:13px;line-height:1.6;resize:vertical;outline:none;font-family:inherit}
  .retell textarea:focus{border-color:var(--ac)}
  .retell .rt-actions{display:flex;gap:8px;margin-top:7px;align-items:center}
  .btn-main{padding:6px 14px;border-radius:8px;border:0;background:var(--ac);color:#fff;font-size:12.5px;cursor:pointer;font-weight:600}
  .btn-main:disabled{opacity:.45;cursor:default}
  .rt-hint{font-size:11.5px;color:var(--tx3)}

  /* 验证结果卡 */
  .card.verify{border-left:3px solid var(--warn)}
  .card.verify.v-pass{border-left-color:var(--ok)}
  .card.verify.v-fail{border-left-color:var(--err)}
  .v-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .v-badge{font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px}
  .v-badge.pass{background:rgba(63,214,143,.15);color:var(--ok)}
  .v-badge.partial{background:rgba(232,180,90,.15);color:var(--warn)}
  .v-badge.fail{background:rgba(239,106,95,.15);color:var(--err)}
  .v-cov{font-size:12.5px;color:var(--tx2)}
  .v-bar{height:7px;border-radius:5px;background:#232c42;overflow:hidden;margin:9px 0 4px}
  .v-bar>div{height:100%;border-radius:5px;background:linear-gradient(90deg,#3a8fe0,var(--ok));transition:width .5s ease}
  .v-points{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .v-point{display:flex;gap:8px;font-size:12.5px;line-height:1.55;align-items:flex-start}
  .v-point .mk{font-weight:700;flex-shrink:0}
  .v-point.hit .mk{color:var(--ok)} .v-point.miss .mk{color:var(--err)}
  .v-point .ev{color:var(--tx3);font-size:11.5px}
  .v-feedback{margin-top:9px;font-size:12.5px;line-height:1.65;color:var(--tx);background:var(--panel);border-radius:8px;padding:8px 11px}
  .v-action{margin-top:8px;font-size:12px;padding:7px 10px;border-radius:8px}
  .v-action.a-retry{background:rgba(232,180,90,.12);color:var(--warn)}
  .v-action.a-teacher{background:rgba(239,106,95,.12);color:var(--err)}
  .v-hollow{margin-top:8px;font-size:12px;color:var(--warn);background:rgba(232,180,90,.1);border-radius:8px;padding:7px 10px}

  /* 提示条（降级/系统） */
  .note{border-radius:var(--r-sm);font-size:12.5px;padding:8px 11px;line-height:1.6}
  .note.warn{background:rgba(232,180,90,.09);border:1px solid rgba(232,180,90,.3);color:#f0d9a0}
  .note.err{background:rgba(239,106,95,.1);border:1px solid rgba(239,106,95,.35);color:#f3b8b2}
  .note.plain{background:var(--panel2);border:1px solid var(--line);color:var(--tx2)}

  /* pending 动画 */
  .pending{display:flex;gap:5px;align-items:center;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);color:var(--tx2);font-size:13px}
  .pending .ti{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:blink 1.1s infinite}
  .pending .ti:nth-child(2){animation-delay:.22s}
  .pending .ti:nth-child(3){animation-delay:.44s}
  @keyframes blink{0%,70%,100%{opacity:.25}35%{opacity:1}}

  /* ---- 右：认知地图 + 复习队列 ---- */
  .right{display:flex;flex-direction:column;min-height:0}
  .maptitle{padding:11px 16px;font-size:12.5px;color:var(--tx2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .maplegend{display:flex;gap:12px;font-size:11px;color:var(--tx3)}
  .maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .mapwrap{flex:1;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 38%,#141b2b 0%,#0d1017 72%)}
  #map{width:100%;height:100%;display:block;cursor:default}
  .map-empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--tx3);font-size:13px;pointer-events:none}
  .map-empty .big{font-size:30px;opacity:.5}
  .queue{max-height:210px;overflow-y:auto;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--panel)}
  .queue h4{margin:2px 0 8px;font-size:12.5px;color:var(--tx2);display:flex;justify-content:space-between}
  .qitem{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:5px 7px;border-radius:7px;cursor:pointer}
  .qitem:hover{background:var(--panel2)}
  .bar{height:6px;border-radius:4px;background:#232c42;overflow:hidden;flex:1}
  .bar>div{height:100%;background:linear-gradient(90deg,#3a8fe0,var(--ac))}
  .q-prio{color:var(--tx2);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}

  /* SVG 图谱元素 */
  .node{cursor:pointer;transition:opacity .25s ease}
  .node circle{transition:filter .2s ease}
  .node:hover circle{filter:brightness(1.25)}
  .node.hot circle{filter:brightness(1.3) drop-shadow(0 0 7px rgba(232,180,90,.85))}
  .node.selected circle{stroke:#fff;stroke-width:2;filter:brightness(1.2) drop-shadow(0 0 9px rgba(255,255,255,.5))}
  .node.dim{opacity:.14}
  .node.born circle{animation:grow .55s cubic-bezier(.22,1.2,.4,1)}
  @keyframes grow{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  .node-label{pointer-events:none;font-size:11px;fill:var(--tx2);transition:opacity .25s ease}
  .node-label.dim{opacity:.1}
  .edge{stroke:rgba(139,148,168,.3);transition:opacity .25s ease,stroke .2s ease}
  .edge.lit{stroke:rgba(79,156,255,.75)}
  .edge.dim{opacity:.08}
  .lv-band{fill:rgba(255,255,255,.02)}
  .lv-label{font-size:10px;fill:var(--tx3);pointer-events:none;letter-spacing:.5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">HSK<b>-Coach</b></div>
    <div class="sub">认知地图 · 偏误图谱 · 费曼复述</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">连接中…</span></div>
  </header>
  <main>
    <div class="left">
      <div class="chat" id="chat">
        <div class="empty">
          <b>输入一句中文</b>，识别偏误 → 费曼讲解 → 沉淀到认知地图。<br>
          讲解后可点「我来复述」，AI 逐点验证你的理解。
        </div>
      </div>
      <div class="inputrow">
        <input id="text" placeholder="例：我想买苹果很多。 / 我有一个猫。" autocomplete="off">
        <button id="send" onclick="submit()">纠错</button>
      </div>
    </div>
    <div class="right">
      <div class="maptitle">
        <span>认知地图 · 横轴=HSK 等级 纵轴=掌握度 大小=错误次数 描边=待复习</span>
        <span class="maplegend">
          <span><i style="background:var(--kp-vocab)"></i>词汇</span>
          <span><i style="background:var(--kp-grammar)"></i>语法</span>
          <span><i style="background:var(--kp-pragma)"></i>语用</span>
          <span><i style="background:var(--kp-char)"></i>汉字</span>
          <span id="mapCount"></span>
        </span>
      </div>
      <div class="mapwrap">
        <svg id="map"></svg>
        <div class="map-empty" id="mapEmpty" style="display:none">
          <div class="big">◎</div>
          <div>地图还是空的 —— 从左侧输入第一个句子开始生长</div>
        </div>
      </div>
      <div class="queue"><h4><span>复习队列 · priority 降序（点击定位）</span></h4><div id="queue"></div></div>
    </div>
  </main>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const SVGNS='http://www.w3.org/2000/svg';
let graph=null;
let selectedNode=null;      // 当前选中节点 id（null=无）
let bornIds=new Set();      // 本次新增节点 → 播放生长动画
const chat=$('chat');

// ============ 通用 ============
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scrollChat(){chat.scrollTop=chat.scrollHeight;}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function addMsg(node){chat.appendChild(node);scrollChat();return node;}

// fetch 封装：检查 r.ok，非 JSON 错误也不至于抛 "Unexpected token"
async function api(url,body){
  let r;
  try{ r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined); }
  catch(e){ throw new Error('无法连接服务（python -m engine.serve 是否在运行？）'); }
  let data=null;
  try{ data=await r.json(); }catch(e){ /* 保持 null */ }
  if(!r.ok){ throw new Error((data&&data.error)?data.error:('HTTP '+r.status)); }
  return data;
}

// ============ 类型 → 样式 ============
function typeClass(t){t=t||'';if(t.includes('词汇'))return 'vocab';if(t.includes('语法'))return 'grammar';if(t.includes('语用'))return 'pragma';if(t.includes('汉字'))return 'char';return 'grammar';}
function typeColor(t){t=t||'';if(t.includes('词汇'))return 'var(--kp-vocab)';if(t.includes('语法'))return 'var(--kp-grammar)';if(t.includes('语用'))return 'var(--kp-pragma)';if(t.includes('汉字'))return 'var(--kp-char)';return 'var(--kp-grammar)';}
function nodeColor(types){return typeColor(Object.keys(types||{}).join(''));}

// ============ 用户消息气泡 ============
function addUserMsg(text){
  return addMsg(el(`<div class="msg-user">${esc(text)}</div>`));
}

// ============ pending（请求完成后移除） ============
function addPending(text){
  return addMsg(el(`<div class="pending"><span class="ti"></span><span class="ti"></span><span class="ti"></span><span>${esc(text)}</span></div>`));
}

// ============ 系统提示条 ============
function addNote(txt,cls){
  return addMsg(el(`<div class="note ${cls||'plain'}">${esc(txt)}</div>`));
}

// ============ 偏误卡（含"我来复述"闭环） ============
function addErrorCard(item){
  const err=item.error||{}, expl=item.explanation||{}, gw=item.graph_write||{};
  const card=el(`<div class="card msg-ai"></div>`);
  const kps=Array.isArray(expl.key_points)?expl.key_points:[];
  const degradedExpl=expl._degraded===true;
  card.innerHTML=`
    <div class="head">
      <span class="tag ${typeClass(err.type)}">${esc(err.type||'偏误')}</span>
      <span class="frag">${esc(err.fragment||'')}</span>
      <span class="corr">→ ${esc(err.correction||'')}</span>
    </div>
    <div class="expl">${esc(expl.explanation||'')}</div>
    ${kps.length?`<div class="kp-row">${kps.map(k=>`<span class="kp">· ${esc(typeof k==='string'?k:(k.text||''))}</span>`).join('')}</div>`:''}
    <div class="meta-row">
      <span>图谱：${esc(gw.status||'?')}${gw.kp_id?' · '+esc(gw.kp_id):''}</span>
      <span>置信 ${err.confidence!=null?Number(err.confidence).toFixed(2):'?'}</span>
    </div>
    ${degradedExpl?'<div class="note warn" style="margin-top:8px">讲解引擎降级：本次仅保留识别与修正结果</div>':''}`;
  // 复述入口（key_points 非空且讲解未降级时才有意义）
  if(!degradedExpl&&kps.length){
    attachRetell(card,expl,kps);
  }
  return addMsg(card);
}

function attachRetell(card,expl,kps){
  const rt=el(`<div class="retell"></div>`);
  rt.innerHTML=`
    <div class="rt-title">用你自己的话复述上面的要点（费曼式——说出来才算懂）</div>
    <textarea placeholder="例：数量词要放在名词前面……"></textarea>
    <div class="rt-actions">
      <button class="btn-main">提交复述</button>
      <span class="rt-hint">AI 将逐点判定覆盖情况</span>
    </div>`;
  card.appendChild(rt);
  const ta=rt.querySelector('textarea'), btn=rt.querySelector('.btn-main');
  btn.addEventListener('click',async()=>{
    const text=ta.value.trim();
    if(!text){ta.focus();return;}
    btn.disabled=true;btn.textContent='验证中…';
    try{
      const out=await api('/api/verify',{
        explanation:expl.explanation||'',
        key_points:kps,
        restatement:text
      });
      ta.value='';                       // 保留复述框：fail 后可修改重试（consecutive_fail 语义）
      addVerifyCard(out,card);
    }catch(e){
      addNote('复述验证失败：'+e.message+'（验证引擎需要 API Key）','err');
    }finally{btn.disabled=false;btn.textContent='提交复述';}
  });
  fold.addEventListener('click',()=>rt.remove());
}

function addVerifyCard(out,afterCard){
  const v=out||{};
  const verdict=v.verdict||'partial';
  const pts=Array.isArray(v.point_judgements)?v.point_judgements:[];
  const total=v.total_points!=null?v.total_points:pts.length;
  const covered=v.covered_points!=null?v.covered_points:pts.filter(p=>p.is_covered).length;
  const ratio=v.coverage_ratio!=null?Number(v.coverage_ratio):0;
  const card=el(`<div class="card verify msg-ai v-${verdict}"></div>`);
  card.innerHTML=`
    <div class="v-head">
      <span class="v-badge ${verdict}">${verdict==='pass'?'通过 ✓':verdict==='partial'?'部分覆盖':'未覆盖 ✗'}</span>
      <span class="v-cov">要点覆盖 ${covered}/${total} · 覆盖率 ${(ratio*100).toFixed(0)}%</span>
    </div>
    <div class="v-bar"><div style="width:${Math.min(ratio*100,100)}%"></div></div>
    ${pts.length?`<div class="v-points">${pts.map(p=>`
      <div class="v-point ${p.is_covered?'hit':'miss'}">
        <span class="mk">${p.is_covered?'✓':'✗'}</span>
        <span>${esc(p.text||'')}
          ${p.is_covered&&p.evidence?`<div class="ev">落实于：${esc(p.evidence)}</div>`:''}
        </span>
      </div>`).join('')}</div>`:''}
    ${v.flowery_but_empty?'<div class="v-hollow">⚠ 流利但空洞：复述顺，但没有落实到具体要点</div>':''}
    ${v.degraded?'<div class="v-hollow">⚠ 验证引擎降级：本次为保守判定（非逐点 LLM 判定）</div>':''}
    ${v.feedback?`<div class="v-feedback">${esc(v.feedback)}</div>`:''}
    ${v.action==='retry_simpler'?'<div class="v-action a-retry">AI 建议换更简单的讲法重新讲一遍</div>':''}
    ${v.action==='suggest_teacher'?`<div class="v-action a-teacher">同一要点连续未通过 ${v.consecutive_fail||'?'} 次，建议找真人老师答疑</div>`:''}`;
  // 验证卡挂在偏误卡之后
  if(afterCard&&afterCard.parentNode){afterCard.after(card);}else{addMsg(card);}
  scrollChat();
  // 验证写回图谱 → 刷新地图
  refreshGraph();
}

// ============ 正确句卡 ============
function addCleanCard(res){
  const card=el(`<div class="card clean msg-ai"></div>`);
  card.innerHTML=`
    <div class="head"><div class="clean-title"><span>✓</span><span>这句话没有发现高置信偏误</span></div></div>
    <div class="clean-sub">继续输入保持练习${(res.uncertain&&res.uncertain.length)?`；${res.uncertain.length} 处低置信候选已进入待确认队列`:''}。</div>`;
  return addMsg(card);
}

// ============ 认知地图（原生 SVG） ============
function levelNum(lv){const m=String(lv||'').match(/\d+/);return m?parseInt(m[0],10):3;}
function layoutNodes(){
  // 布局：X=HSK 等级列（动态 maxLevel，1-6），Y=掌握度（同列节点排序后均匀分摊，防完全重叠）
  const nodes=graph&&graph.nodes?graph.nodes:{};
  const svg=$('map');
  const W=svg.clientWidth||800, H=svg.clientHeight||520;
  const top=34, bottom=H-58;
  const lvSet=new Set([1,2,3,4]);
  Object.values(nodes).forEach(n=>{const v=levelNum(n.level);if(v>=1&&v<=6)lvSet.add(v);});
  const maxLv=Math.max(...lvSet);
  const colW=Math.max((W-90)/maxLv,70);
  const xOf=lv=>45+(levelNum(lv)-.5)*colW;
  // 分列 → 按 mastery 排序 → 均匀分摊整列高度（保持 Y 序=掌握度序）
  const cols={};
  Object.entries(nodes).forEach(([id,n])=>{
    const k=levelNum(n.level);(cols[k]=cols[k]||[]).push([id,n]);
  });
  const pos={};
  Object.values(cols).forEach(list=>{
    list.sort((a,b)=>(a[1].mastery||0)-(b[1].mastery||0));
    const n=list.length;
    list.forEach(([id,node],i)=>{
      const span=bottom-top;
      const y=n===1?(top+span*(1-(node.mastery||0))):top+span*(i/(n-1));
      pos[id]={x:xOf(node.level),y:Math.max(top,Math.min(bottom,y))};
    });
  });
  return {pos,W,H,maxLv,colW,xOf,top,bottom};
}

function renderMap(){
  const svg=$('map');
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  const nodes=graph&&graph.nodes?graph.nodes:{};
  const ids=Object.keys(nodes);
  const L=layoutNodes();
  $('mapCount').textContent=ids.length+' 节点';
  $('mapEmpty').style.display=ids.length?'none':'flex';
  const g=document.createElementNS(SVGNS,'g');
  g.setAttribute('id','gRoot');
  // 等级背景带
  for(let lv=1;lv<=L.maxLv;lv++){
    const band=document.createElementNS(SVGNS,'rect');
    band.setAttribute('x',45+(lv-1)*L.colW);band.setAttribute('y',L.top-22);
    band.setAttribute('width',L.colW);band.setAttribute('height',L.bottom-L.top+22);
    band.setAttribute('class','lv-band');if(lv%2===0)band.setAttribute('fill','transparent');
    g.appendChild(band);
    const t=document.createElementNS(SVGNS,'text');
    t.setAttribute('x',L.xOf('HSK'+lv));t.setAttribute('y',L.bottom+30);
    t.setAttribute('text-anchor','middle');t.setAttribute('class','lv-label');
    t.textContent='HSK '+lv;g.appendChild(t);
  }
  // 掌握度轴
  const ax=document.createElementNS(SVGNS,'text');
  ax.setAttribute('x',12);ax.setAttribute('y',L.top);ax.setAttribute('class','lv-label');
  ax.textContent='已掌握';g.appendChild(ax);
  const ax2=document.createElementNS(SVGNS,'text');
  ax2.setAttribute('x',12);ax2.setAttribute('y',L.bottom+4);ax2.setAttribute('class','lv-label');
  ax2.textContent='待巩固';g.appendChild(ax2);

  const prioOf=id=>{const q=(graph&&graph.queue||[]).find(x=>x.kp_id===id);return q?q.priority:0;};
  // 边
  const edges=(graph&&graph.edges||[]).filter(e=>nodes[e.from_node_id]&&nodes[e.to_node_id]);
  const edgeElems=edges.map(e=>{
    const a=L.pos[e.from_node_id],b=L.pos[e.to_node_id];
    const line=document.createElementNS(SVGNS,'line');
    line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);
    line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);
    line.setAttribute('class','edge');
    line.setAttribute('stroke-width',1+Math.min((e.edge_weight||1),3));
    line.dataset.from=e.from_node_id;line.dataset.to=e.to_node_id;
    g.appendChild(line);return line;
  });
  // 节点（含 <title> tooltip / hover 邻接高亮 / 点击选中）
  const neighbors=id=>{
    const s=new Set();
    edges.forEach(e=>{if(e.from_node_id===id)s.add(e.to_node_id);if(e.to_node_id===id)s.add(e.from_node_id);});
    return s;
  };
  ids.forEach(id=>{
    const n=nodes[id],p=L.pos[id];
    const prio=prioOf(id);
    const grp=document.createElementNS(SVGNS,'g');
    grp.setAttribute('class','node');
    if(bornIds.has(id))grp.classList.add('born');
    const r=13+Math.min((n.error_count||0)*6,26);
    const c=document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',r);
    c.setAttribute('fill',nodeColor(n.error_types));c.setAttribute('opacity',.88);
    if(prio>1){c.setAttribute('stroke','var(--warn)');c.setAttribute('stroke-width',2.5);}
    grp.appendChild(c);
    // 有效 tooltip（SVG <title> 子元素）
    const tip=document.createElementNS(SVGNS,'title');
    tip.textContent=`${n.knowledge_point||id}\n等级 ${n.level||'?'} · 掌握度 ${(n.mastery||0).toFixed(2)}\n错误 ${n.error_count||0} 次 · 复习优先级 ${prio.toFixed(2)}`;
    grp.appendChild(tip);
    const label=document.createElementNS(SVGNS,'text');
    label.setAttribute('x',p.x);label.setAttribute('y',p.y+r+13);
    label.setAttribute('text-anchor','middle');label.setAttribute('class','node-label');
    label.textContent=(n.knowledge_point||id).slice(0,7);
    grp.appendChild(label);
    grp.dataset.id=id;
    grp.addEventListener('mouseenter',()=>hoverNode(id,true));
    grp.addEventListener('mouseleave',()=>hoverNode(id,false));
    grp.addEventListener('click',ev=>{ev.stopPropagation();selectNode(id);});
    g.appendChild(grp);
  });
  svg.appendChild(g);
  svg.onclick=()=>selectNode(null);   // onclick 赋值幂等：renderMap 反复调用不叠加监听
  if(selectedNode)applySelection();
}

function hoverNode(id,on){
  const root=$('gRoot');if(!root)return;
  const nb=new Set();(graph&&graph.edges||[]).forEach(e=>{
    if(e.from_node_id===id)nb.add(e.to_node_id);if(e.to_node_id===id)nb.add(e.from_node_id);});
  root.querySelectorAll('.edge').forEach(line=>{
    const lit=on&&(line.dataset.from===id||line.dataset.to===id);
    line.classList.toggle('lit',lit);
  });
}

function selectNode(id){
  selectedNode=(selectedNode===id)?null:id;
  applySelection();
  // 队列侧联动标记
  document.querySelectorAll('.qitem').forEach(q=>q.style.background=(q.dataset.kp===selectedNode)?'var(--panel2)':'');
}

function applySelection(){
  const root=$('gRoot');if(!root)return;
  if(!selectedNode){
    root.querySelectorAll('.node').forEach(n=>n.classList.remove('dim','selected','hot'));
    root.querySelectorAll('.node-label').forEach(t=>t.classList.remove('dim'));
    root.querySelectorAll('.edge').forEach(e=>e.classList.remove('dim','lit'));
    return;
  }
  const nb=new Set();(graph&&graph.edges||[]).forEach(e=>{
    if(e.from_node_id===selectedNode)nb.add(e.to_node_id);
    if(e.to_node_id===selectedNode)nb.add(e.from_node_id);});
  root.querySelectorAll('.node').forEach(n=>{
    const id=n.dataset.id;
    n.classList.toggle('selected',id===selectedNode);
    n.classList.toggle('dim',id!==selectedNode&&!nb.has(id));
    n.classList.toggle('hot',nb.has(id));
    const lbl=n.querySelector('.node-label');
    if(lbl)lbl.classList.toggle('dim',id!==selectedNode&&!nb.has(id));
  });
  root.querySelectorAll('.edge').forEach(line=>{
    const touching=line.dataset.from===selectedNode||line.dataset.to===selectedNode;
    line.classList.toggle('lit',touching);
    line.classList.toggle('dim',!touching);
  });
}

// ============ 复习队列（点击定位节点） ============
function renderQueue(){
  const q=graph&&graph.queue||[];
  const box=$('queue');
  box.innerHTML='';
  if(!q.length){box.innerHTML='<div class="empty" style="padding:10px">暂无复习项</div>';return;}
  q.slice(0,10).forEach(item=>{
    const n=item.node||{};
    const row=el(`<div class="qitem" data-kp="${esc(item.kp_id||'')}">
      <span style="min-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.knowledge_point||item.kp_id||'')}</span>
      <div class="bar"><div style="width:${Math.min((item.priority||0)*10,100)}%"></div></div>
      <span class="q-prio">${(item.priority||0).toFixed(1)}</span>
    </div>`);
    row.addEventListener('click',()=>selectNode(item.kp_id));
    box.appendChild(row);
  });
}

// ============ 图谱刷新 ============
async function refreshGraph(){
  try{
    graph=await api('/api/graph');
    renderMap();renderQueue();
    setStatus(true,`learner ${graph.learner_id||'demo'} · ${Object.keys(graph.nodes||{}).length} 节点`);
  }catch(e){/* 静默：主流程已有提示 */}
}
function setStatus(on,text){
  const s=$('status');s.className='status '+(on?'on':'off');
  $('statusText').textContent=text;
}

// ============ 主流程 ============
async function submit(){
  const input=$('text'),btn=$('send');
  const text=input.value.trim();
  if(!text)return;
  btn.disabled=true;input.value='';
  const emptyEl=chat.querySelector('.empty');if(emptyEl)emptyEl.remove();
  addUserMsg(text);
  const pend=addPending('正在识别偏误并生成讲解…');
  try{
    const res=await api('/api/process',{text});
    // 记录新节点 → 生长动画
    const before=new Set(Object.keys((graph&&graph.nodes)||{}));
    graph=res.graph||graph;
    bornIds=new Set(Object.keys(graph&&graph.nodes||{}).filter(id=>!before.has(id)));
    // 渲染
    if(res.errors&&res.errors.length){
      res.errors.forEach(item=>addErrorCard(item));
    }else{
      addCleanCard(res);
    }
    // 降级（完整展示 stage[致命] reason —— 契约 §5）
    (res.degraded||[]).forEach(d=>{
      addNote(`⚠ ${d.stage}${d.fatal?'[致命]':''}：${d.reason||''}`,'warn');
    });
    // 耗时（契约 meta）
    if(res.meta&&res.meta.elapsed_ms!=null){
      addNote(`完成 · 耗时 ${res.meta.elapsed_ms} ms · 图谱 ${res.graph_size!=null?res.graph_size:'?'} 节点`,'plain');
    }
    renderMap();renderQueue();
    setStatus(true,`learner ${res.learner_id||'demo'} · ${res.graph_size!=null?res.graph_size:Object.keys(graph.nodes||{}).length} 节点`);
  }catch(e){
    addNote('请求失败：'+e.message,'err');
  }finally{
    pend.remove();           // pending 必须消失
    btn.disabled=false;input.focus();
  }
}

// ============ 启动 ============
(async function init(){
  $('text').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  try{
    graph=await api('/api/graph');
    renderMap();renderQueue();
    setStatus(true,`learner ${graph.learner_id||'demo'} · ${Object.keys(graph.nodes||{}).length} 节点`);
  }catch(e){
    setStatus(false,'服务未连接');
    addNote('无法加载图谱：'+e.message,'err');
  }
  window.addEventListener('resize',()=>{renderMap();});
})();
</script>
