[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "HSK-AI-Coach"
version = "0.1.0"
description = "面向 HSK 中文学习者的 AI 偏误纠错陪练：偏误检测 → 讲清原因 → 复述检验 → 复习计划。"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "linglong999" }]
license = { text = "MIT" }
keywords = ["HSK", "中文学习", "偏误纠错", "AI", "中文教育"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fsrs==6.3.2",
    "openai==3.3.1",
]

[dependency-groups]
# uv sync 默认安装 dev 组（含 pytest/httpx）——TestClient(SSE 冒烟) 依赖 httpx
dev = ["pytest>=7", "httpx"]

[project.scripts]
hsk-coach = "engine.serve:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["engine*", "config*", "planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
